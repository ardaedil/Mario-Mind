[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mariomind"
version = "0.1.0"
description = "Experimental RL lab for Mario World 1-1"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.2",
  "gymnasium>=0.29",
  "opencv-python>=4.8",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "pyyaml>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
